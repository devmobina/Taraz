{% extends "base.html" %}
{% load static %}
    {% block title %}پروفایل | تراز{% endblock %}
{% block extra_styles %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
{% endblock %}
{% block extra_main %}
    <main>
        <div class="page" style="width: 80%; margin-right: 250px;">
            <section class="welcome">
                <div>
                    <span class="eyebrow">حساب کاربری</span>
                    <h1>پروفایل</h1>
                    <p>اطلاعات حساب خود را مدیریت کنید.</p>
                </div>
            </section>

            <section class="panel">
                <form id="profile-form" class="form-grid" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="field">
                        <label for="profile-name">نام و نام خانوادگی</label>
                        <input
                            id="profile-name"
                            name="name"
                            type="text"
                            value="{{ form_data.name|default:profile_user.name }}"
                            maxlength="127"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="profile-email">ایمیل</label>
                        <input
                            id="profile-email"
                            name="email"
                            type="email"
                            value="{{ form_data.email|default:profile_user.email }}"
                            maxlength="254"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="profile-phone">شماره تلفن</label>
                        <input
                            id="profile-phone"
                            name="phone"
                            type="tel"
                            value="{{ form_data.phone|default:profile_user.phone }}"
                            maxlength="20"
                        >
                    </div>

                    <div class="field">
                        <label for="profile-username">نام کاربری</label>
                        <input
                            id="profile-username"
                            value="{{ profile_user.username }}"
                            disabled
                        >
                    </div>

                    <div class="field">
                        <label for="profile-status">وضعیت حساب</label>
                        <input
                            id="profile-status"
                            value="{% if profile_user.is_active %}فعال{% else %}غیرفعال{% endif %}"
                            disabled
                        >
                    </div>

                    <div class="field">
                        <label for="profile_image">تغییر تصویر پروفایل</label>
                        <input 
                            type="file" 
                            id="profile_image" 
                            name="profile_image" 
                            accept="image/*"
                        >
                    </div>

                    <div class="field full">
                        <button class="btn" type="submit">
                            ذخیره تغییرات
                        </button>
                    </div>
                </form>
            </section>
        </div>

        <div class="toast" id="toast" role="status"></div>
    </main>
{% endblock %}

<script src="app.js"></script>
<script src="chart.umd.min.js" defer></script>
